<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#1F2A44"></head><body>
<title>희주 윤재 두번째 여행 - 홍콩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: the diorama owns the screen; a minibus destination plate names where we are;
   on phones the info sheet sits under the map and expands, on desktop it is a side column. */
:root{
  --bg:#EEF2F6; --paper:#FFFFFF; --sunk:#F2F5F8; --ink:#1F2A44; --muted:#66738A; --line:#D8DFE8; --rule:#1F2A44; --sun:#E0784C; --sun-soft:#FBE7DC; --day:#1E9A5A; --passed:#C3CBD6;
  --green:#1F7A4D; --green-ink:#FFFFFF; --red:#D7263D; --egg:#F6C343; --plate:#FFF8E6; --plate-ink:#17262E;
  --d1:#D9443B; --d2:#1E9A5A; --d3:#2F6FBF; --d4:#7B55A6;
  --ok:#1C8E57; --ok-bg:#DDF3E6; --warn:#A86A00; --warn-bg:#FCEFCF; --bad:#C81E35; --bad-bg:#FCE1E4; --info:#46606F; --info-bg:#E6EFF2;
  --f-sign:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-head:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-han:"Noto Serif TC","Noto Serif CJK TC","Songti TC",serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151F; --paper:#171E2B; --sunk:#1D2533; --ink:#E8EDF5; --muted:#9AA6B8; --line:#2A3445; --rule:#E8EDF5; --sun:#F29A72; --sun-soft:#3A2A24; --passed:#3A4558;
  --green:#3FC787; --green-ink:#08180F; --red:#FF4F9A; --egg:#FFD25E; --plate:#FFF3D6; --plate-ink:#17262E;
  --d1:#6EA4FF; --d2:#3CCB9E; --d3:#FFB24A; --d4:#B49BF2;
  --ok:#55D898; --ok-bg:#15372A; --warn:#F5C451; --warn-bg:#3A2F12; --bad:#FF7FA8; --bad-bg:#3E1A2A; --info:#AFC4D3; --info-bg:#1D3148;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10151F; --paper:#171E2B; --sunk:#1D2533; --ink:#E8EDF5; --muted:#9AA6B8; --line:#2A3445; --rule:#E8EDF5; --sun:#F29A72; --sun-soft:#3A2A24; --passed:#3A4558;
  --green:#3FC787; --green-ink:#08180F; --red:#FF4F9A; --egg:#FFD25E; --plate:#FFF3D6; --plate-ink:#17262E;
  --d1:#6EA4FF; --d2:#3CCB9E; --d3:#FFB24A; --d4:#B49BF2;
  --ok:#55D898; --ok-bg:#15372A; --warn:#F5C451; --warn-bg:#3A2F12; --bad:#FF7FA8; --bad-bg:#3E1A2A; --info:#AFC4D3; --info-bg:#1D3148;
  color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--egg);outline-offset:2px;border-radius:8px}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.top h1{font-family:var(--f-sign);font-weight:400;font-size:24px;margin:0;line-height:1.1}
.days{display:flex;gap:6px;flex-wrap:wrap}
.daybtn{border:2px solid transparent;background:var(--paper);border-radius:10px;padding:3px 10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;white-space:nowrap}
@media (max-width:959px){ header.top h1{order:0} header.top .live{order:1} header.top .days{order:2;width:100%;display:grid;grid-template-columns:repeat(2,1fr)} }
@media (min-width:600px) and (max-width:959px){ header.top .days{grid-template-columns:repeat(4,1fr)} }
.daybtn i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.daybtn[aria-pressed="true"]{border-color:var(--c);font-weight:700}
.live{margin-left:auto;font-size:13px;color:var(--muted)}
.live.on{color:var(--red);font-weight:700}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
@media (min-width:960px){ main{display:grid;grid-template-columns:minmax(0,1fr) 400px} }
.stage{position:relative;border-radius:20px;overflow:hidden;background:#BFE6F5;flex:1;min-height:260px;display:flex;flex-direction:column}
#view{flex:1;position:relative;min-height:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
/* the one loud element: minibus destination plate */
.plate{position:absolute;left:16px;top:16px;max-width:calc(100% - 32px);border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(10,30,40,.22);background:var(--plate);color:var(--plate-ink);transform-origin:top center}
.plate .band{background:var(--red);color:#FFFFFF;font-family:var(--f-sign);font-size:14px;padding:3px 12px;display:flex;justify-content:space-between;gap:12px}
.plate .dest{display:flex;align-items:baseline;gap:12px;padding:4px 14px 7px;font-family:var(--f-sign)}
.plate .dest b{font-weight:400;font-size:clamp(22px,4.2vw,34px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.plate .dest span{font-size:18px;color:#3C5560;white-space:nowrap}
.plate.drop{animation:drop .5s cubic-bezier(.3,1.5,.6,1)}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
.tilt{position:absolute;inset:0;pointer-events:none;-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px);-webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 26%,transparent 72%,#000 100%);mask-image:linear-gradient(to bottom,#000 0%,transparent 26%,transparent 72%,#000 100%);box-shadow:inset 0 0 80px rgba(20,40,50,.18)}
.bubble{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#FFFFFF;color:#17262E;border-radius:14px;padding:4px 10px;font-size:13px;line-height:1.35;box-shadow:0 3px 10px rgba(20,40,60,.18);pointer-events:none;max-width:200px;text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:#FFFFFF;border-bottom:0}
.camctl{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.pill{border:0;background:rgba(255,255,255,.92);color:#17262E;border-radius:999px;padding:5px 12px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.camctl .pill{width:72px;text-align:center;padding:4px 0;font-size:10px}
.pill[aria-pressed="true"]{background:#17262E;color:#FFFFFF}
.timebar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:rgba(255,255,255,.94);color:#17262E}
.timebar .clock{font-family:var(--f-sign);font-size:24px;font-variant-numeric:tabular-nums;min-width:62px}
.track{position:relative;flex:1;min-width:0;height:36px;cursor:pointer;touch-action:none}
.track .rail,.track .fill{position:absolute;left:0;top:11px;height:8px;border-radius:4px}
.track .rail{right:0;background:#DCEBE3}
.track .fill{background:#1F7A4D}
.track .tk{position:absolute;top:9px;width:3px;height:12px;border-radius:2px;background:#7E9A8C;transform:translateX(-50%)}
.track .tk.warn{background:#E2A11B;width:6px;height:16px;top:7px;border-radius:3px}
.track .tk.bad{background:#D7263D;width:6px;height:16px;top:7px;border-radius:3px}
.track .hd{position:absolute;top:5px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;border:3px solid #1F7A4D;transform:translateX(-50%);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.track .hr{position:absolute;top:22px;font-size:10px;color:#557064;transform:translateX(-50%);white-space:nowrap}
.track:focus-visible{outline:3px solid #F6C343;outline-offset:2px;border-radius:8px}
.timebar select{border:1px solid #CBE0D5;border-radius:8px;background:#FFFFFF;color:#17262E;padding:3px 4px;font-size:13px}
.round{width:40px;height:40px;border-radius:50%;border:0;background:#1F7A4D;color:#FFFFFF;font-size:15px;flex:none}
.film{border:0;border-radius:999px;background:#D7263D;color:#FFFFFF;padding:8px 14px;font-family:var(--f-sign);font-size:16px;flex:none}
/* sheet */
.sheet{background:var(--paper);border-radius:20px;display:flex;flex-direction:column;min-height:0;overflow:hidden;flex:none;height:40%;transition:height .25s ease}
.sheet.open{height:72%}
@media (min-width:960px){ .sheet,.sheet.open{height:auto} .handle{display:none} }
.handle{border:0;background:transparent;padding:8px 0 2px;display:flex;justify-content:center}
.handle::before{content:"";width:44px;height:5px;border-radius:3px;background:var(--line)}
.seg{display:flex;gap:4px;margin:6px 16px 0;padding:4px;background:var(--sunk);border-radius:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:6px;font-family:var(--f-sign);font-size:16px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.panel{padding:12px 16px 16px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.lead{font-family:var(--f-sign);font-size:28px;line-height:1.15;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lead small{font-family:var(--f-body);font-size:15px;color:var(--muted)}
.muted{color:var(--muted)}
.sm{font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
hr{border:0;border-top:1px dashed var(--line);margin:0}
.next{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center}
.next .ic{font-size:26px;grid-row:span 2}
.next b{font-size:17px}
.next .t{font-family:var(--f-sign);font-size:20px;grid-row:span 2}
a.btn,button.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 12px;text-decoration:none;color:var(--ink);font-size:14px}
a.btn.go,button.btn.go{background:var(--green);border-color:var(--green);color:var(--green-ink)}
button.btn.q{background:var(--sunk);border-color:transparent}
.spot{font-size:13.5px;display:flex;gap:6px}
.note{font-size:13.5px;border-left:3px solid var(--egg);padding:2px 0 2px 10px}
.chip{font-size:12px;border-radius:6px;padding:1px 7px;white-space:nowrap;font-weight:700}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)}
.iss{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.iss .chip{flex:none;margin-top:2px}
.sum{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.switch{display:flex;align-items:center;gap:8px;font-size:14px}
.switch input{width:18px;height:18px;accent-color:var(--green)}
ol.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pi{border-bottom:1px solid var(--line)}
.pi > button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:88px 1fr auto;gap:8px;align-items:center;padding:9px 4px;cursor:pointer}
.pi > button:focus-visible{outline:3px solid var(--egg)}
.pi.now > button{background:color-mix(in srgb,var(--red) 8%,transparent);border-radius:8px}
.pi.dim{opacity:.55}
.pi .t{font-family:var(--f-sign);font-size:16px;font-variant-numeric:tabular-nums;line-height:1.2}
.pi .t s{display:block;color:var(--muted);font-size:12px;font-family:var(--f-body)}
.pi .n{min-width:0}
.pi .n small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .det{padding:0 4px 12px 96px;display:flex;flex-direction:column;gap:6px}
@media (max-width:420px){ .pi > button{grid-template-columns:62px 1fr auto} .pi .det{padding-left:4px} }
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:11.5px;line-height:1.2;color:var(--muted)}
.stamp .e{font-size:24px;filter:grayscale(1);opacity:.4}
.stamp.got{border:3px double var(--c);color:var(--c);transform:rotate(var(--rot));background:color-mix(in srgb,var(--c) 9%,var(--paper))}
.stamp.got .e{filter:none;opacity:1}
.foot{font-size:12px;color:var(--muted)}
.box{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.box h3{margin:0;font-family:var(--f-sign);font-weight:400;font-size:17px}
.box.mission{border-color:color-mix(in srgb,var(--egg) 70%,var(--line));background:color-mix(in srgb,var(--egg) 10%,var(--paper))}
.phr{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline}
.phr .zh{font-size:16px}
.phr small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.exp .row input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--paper);color:var(--ink)}
.exp .row input[type=number]{max-width:130px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{border:1.5px solid var(--line);background:var(--paper);border-radius:9px;padding:5px 12px;font-size:14px}
.choices button[aria-pressed="true"]{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--paper));font-weight:700}
.el{display:flex;gap:8px;align-items:center;font-size:13.5px}
.el span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el b{font-family:var(--f-sign);font-weight:400;font-size:16px}
.x{border:0;background:transparent;color:var(--muted);font-size:16px;padding:2px 6px}
.money{font-family:var(--f-sign);font-size:30px;line-height:1.1}
.stamp.gold{border:3px double #E2A81B;color:#A87A00;background:color-mix(in srgb,#F6C343 20%,var(--paper))}
.stamp .star{font-size:12px}
.rec textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);color:var(--ink);font:inherit;resize:vertical}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thw{position:relative}
.thw .x{position:absolute;top:-6px;right:-6px;background:var(--paper);border-radius:50%;width:22px;height:22px;padding:0;line-height:20px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.th{border:0;padding:0;background:var(--sunk);border-radius:10px;overflow:hidden;width:72px;height:72px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.diary{display:flex;flex-direction:column;gap:4px;padding:6px 0;border-bottom:1px dashed var(--line)}
.diary p{margin:0;white-space:pre-wrap}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(10,20,30,.88);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px))}
.viewer img{max-width:100%;max-height:85vh;border-radius:12px}
.viewer .pill{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}
.ml{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ml input{width:18px;height:18px;margin-top:2px;accent-color:#E2A81B;flex:none}
/* video mode */
.vid{position:fixed;inset:0;z-index:50;background:#0B1520;display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.vframe{position:relative;height:100%;max-width:100%;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#000}
#vcanvas{width:100%;height:100%;display:block}
.vtop{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.vbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:3px;height:6px}
.vbar button{all:unset;cursor:pointer;flex:var(--w);height:6px;border-radius:3px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.vbar button i{position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--c)}
.vstat{position:absolute;left:0;right:0;bottom:26px;text-align:center;color:#FFFFFF;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.vsetup{position:absolute;inset:auto 0 0 0;max-height:88%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:20px 20px 0 0;padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
.vsetup h2{font-family:var(--f-sign);font-weight:400;font-size:24px;margin:0}
.opt{display:flex;flex-direction:column;gap:6px}
.opt > span{font-size:13px;color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{border:1.5px solid var(--line);background:var(--paper);border-radius:9px;padding:5px 12px;font-size:14px}
.choices button[aria-pressed="true"]{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--paper));font-weight:700}
details.photos summary{cursor:pointer;font-size:14px}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.prow{display:flex;align-items:center;gap:10px;font-size:14px}
.prow img,.prow .ph{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--sunk);flex:none;display:flex;align-items:center;justify-content:center}
.prow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vmsg{font-size:13.5px;color:var(--muted)}

/* ===== MTR line + photo palette ===== */
body{font-size:14.5px}
.top h1{font-family:var(--f-head);font-weight:900;font-size:20px;letter-spacing:-.02em}
.days{gap:6px}
.daybtn{border:1.5px solid transparent;background:transparent;border-radius:6px;padding:3px 9px 3px 4px;gap:7px;color:var(--muted);font-family:var(--f-head);font-size:13.5px;font-weight:500}
.daybtn i{display:none}
.daybtn .lb,.lb{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:4px;background:var(--c);color:#FFFFFF;font-weight:900;font-size:12.5px;font-family:var(--f-head);flex:none}
.daybtn:not([aria-pressed="true"]) .lb{opacity:.55}
.daybtn[aria-pressed="true"]{border-color:var(--c);background:var(--paper);color:var(--ink);font-weight:700}
.stage{border-radius:10px}
.sheet{border-radius:10px;background:var(--paper);border:0}
.handle::before{border-radius:2px;height:4px;width:40px;background:var(--line)}
.strip{display:flex;align-items:center;gap:10px;margin:6px 16px 0;padding:10px 12px;border-radius:8px;background:var(--ink);color:var(--paper);cursor:pointer;min-width:0}
.strip .k{font-size:12px;opacity:.7;flex:none}
.strip b{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.strip .han{font-family:var(--f-han);font-size:13px;opacity:.75;white-space:nowrap}
.strip .t{margin-left:auto;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;flex:none}
.strip .m{font-size:12px;opacity:.75;flex:none}
@media (max-width:959px){ .sheet{height:auto;max-height:none} .sheet:not(.open) .seg,.sheet:not(.open) .panel{display:none} .sheet:not(.open){padding-bottom:10px} .sheet.open{height:72%} }
@media (min-width:960px){ .handle{display:none} .strip{margin-top:16px} }
.seg{background:none;padding:0;margin:10px 16px 0;gap:20px;border-radius:0;border-bottom:1px solid var(--line)}
.seg button{flex:none;border-radius:0;padding:9px 0 8px;margin-bottom:-1px;border-bottom:3px solid transparent;font-family:var(--f-head);font-size:14.5px;font-weight:500;color:var(--muted)}
.seg button[aria-selected="true"]{background:none;box-shadow:none;color:var(--ink);font-weight:900;border-bottom-color:var(--day)}
.panel{gap:16px;padding-top:14px}
.lead{font-family:var(--f-head);font-weight:900;font-size:24px;letter-spacing:-.02em}
.lead small{font-weight:400}
hr{border-top:1px solid var(--line)}

function plan(dn,worst,clean){
  const st0=store; if(clean) store={stayDelay:{},legDelay:{},skips:{}};
  const day=DATA[dn-1]; let t=day.start; const rows=[];
  for(const st of day.stops){
    if(st.alt){ rows.push({st,alt:true,arr:st.arr,dep:st.arr+st.stay,issues:[{lv:'info',msg:'대안 코스: '+(st.note||'')}]}); continue; }
    if(store.skips[st.id]){ rows.push({st,skipped:true,arr:null,dep:null,issues:[{lv:'info',msg:'건너뛰기로 했어요'}]}); continue; }
    const issues=[]; let travel=st.travel+(store.legDelay[st.id]||0);
    if(store.legDelay[st.id]) issues.push({lv:'info',msg:`가는 길에 ${store.legDelay[st.id]}분 늦어졌어요`});
    if(st.legRisk){ if(worst){ travel+=st.legRisk.max; issues.push({lv:'warn',msg:`가는 길 대기 ${st.legRisk.max}분 가정. ${st.legRisk.why}`}); } else issues.push({lv:'warn',msg:`가는 길 대기 ${st.legRisk.min}~${st.legRisk.max}분 가능. ${st.legRisk.why}`}); }
    let arr=t+travel;
    if(st.fixedArr!=null){ if(arr<st.fixedArr) arr=st.fixedArr; else if(arr>st.fixedArr) issues.push({lv:'bad',msg:`${st.fixedWhy}에 ${arr-st.fixedArr}분 늦어요`}); }
    let stay=st.stay; const shift=arr-st.arr;
    if(shift>0&&st.minStay!=null&&stay>st.minStay){ const cut=Math.min(shift,stay-st.minStay); stay-=cut; issues.push({lv:'info',msg:`늦어진 ${cut}분을 여기서 줄였어요 (${durTxt(stay)} 머묾)`}); }
    if(st.queue){ const need=st.queue.max+st.minVisit;
      if(worst){ const over=Math.max(0,need-stay); if(over>0){ stay+=over; issues.push({lv:'warn',msg:`대기 ${st.queue.max}분 가정, ${over}분 더 머묾. ${st.queue.why}`}); } }
      else if(need>stay) issues.push({lv:'warn',msg:`대기 ${st.queue.min}~${st.queue.max}분 가능. ${st.queue.why}`}); }
    if(store.stayDelay[st.id]){ stay+=store.stayDelay[st.id]; issues.push({lv:'info',msg:`여기서 ${store.stayDelay[st.id]}분 더 있었어요`}); }
    const dep=arr+stay;
    if(st.open!=null&&arr<st.open) issues.push({lv:'warn',msg:`${fmt(st.open)} 오픈이라 ${st.open-arr}분 기다려요`});
    if(st.close!=null){
      if(st.exteriorOnly&&arr>=st.close) issues.push({lv:'info',msg:`내부는 ${fmt(st.close)}에 닫아요. 밤엔 외관과 광장만`});
      else if(arr>=st.close) issues.push({lv:'bad',msg:`도착하면 이미 닫았어요 (${fmt(st.close)} 마감)`});
      else if(dep>st.close) issues.push({lv:'warn',msg:`${fmt(st.close)}에 닫아서 ${dep-st.close}분 덜 머물러요`}); }
    if(st.unknownHours) issues.push({lv:'info',msg:'영업시간 미확인. 가기 전에 확인하세요'});
    if(RAINON&&RAINALT[st.key]) issues.push({lv:/괜찮/.test(RAINALT[st.key])?'info':'warn',msg:'비 오면: '+RAINALT[st.key]});
    if(st.sunset){ if(arr<=SUNSET-15) issues.push({lv:'ok',msg:`일몰(17:40경)보다 ${SUNSET-arr}분 먼저 도착`}); else issues.push({lv:'warn',msg:`일몰 17:40경. 해 지는 걸 보려면 ${arr-(SUNSET-15)}분 일찍 와야 해요`}); }
    if(st.night&&arr<SUNSET+20) issues.push({lv:'warn',msg:'창밖이 어두워진 뒤(18시 이후)가 사진이 예뻐요'});
    if(st.checkout!=null&&dep>st.checkout) issues.push({lv:'bad',msg:`체크아웃 11:00보다 ${dep-st.checkout}분 늦어요`});
    if(st.flight!=null){ if(arr>st.flight-60) issues.push({lv:'bad',msg:`탑승 수속 마감(출발 1시간 전)에 걸려요`}); else if(arr>st.flight-120) issues.push({lv:'warn',msg:`출발 2시간 전 도착을 권장해요 (지금 ${st.flight-arr}분 전)`}); else issues.push({lv:'ok',msg:`출발 ${durTxt(st.flight-arr)} 전 도착`}); }
    if(st.bagDrop) issues.push({lv:'info',msg:'체크인 15:00 전이라 짐만 맡겨요'});
    rows.push({st,arr,dep,stay,travel,shift,issues}); t=dep;
  }
  rows.forEach(r=>{ r.lv=r.issues.reduce((a,i)=>LV[i.lv]>LV[a]?i.lv:a,'ok'); });
  const chain=rows.filter(r=>!r.alt&&!r.skipped); const end=chain.length?chain[chain.length-1].arr:null;
  const counts={bad:0,warn:0,ok:0}; chain.forEach(r=>{ if(r.lv==='bad')counts.bad++; else if(r.lv==='warn')counts.warn++; else counts.ok++; });
  store=st0; return {rows,chain,end,counts,start:day.start};
}
function where(Pl,t){
  const c=Pl.chain; if(!c.length) return {phase:'done'};
  if(t<Pl.start) return {phase:'before',next:c[0],i:0};
  for(let i=0;i<c.length;i++){ const r=c[i], from=i===0?Pl.start:c[i-1].dep;
    if(t<r.arr) return {phase:'move',from:i>0?c[i-1]:null,to:r,i,frac:Math.max(0,Math.min(1,(t-from)/Math.max(1,r.arr-from))),left:r.arr-t};
    if(t<r.dep) return {phase:'stay',at:r,next:c[i+1]||null,i,left:r.dep-t}; }
  return {phase:'done',last:c[c.length-1]};
}

  $('photoMsg').textContent='올린 사진은 이 웹앱에 저장되고, 링크를 공유받은 사람도 볼 수 있어요.';
  $('plist').innerHTML=rows.map(([r,dn])=>{ const ph=PHOTOS[r.st.id]; return `<div class="prow">${ph?`<img src="/_blob/${esc(ph.assetId)}" alt="">`:`<span class="ph">${r.st.icon}</span>`}<span>${dn}일차 ${esc(short(r.st.name))}</span><button class="btn q" data-up="${r.st.id}">${ph?'바꾸기':'사진 올리기'}</button></div>`; }).join('');
}
let upTarget=null;
$('plist').addEventListener('click',e=>{ const b=e.target.closest('[data-up]'); if(!b) return; upTarget=b.dataset.up; $('fileIn').value=''; $('fileIn').click(); });
$('fileIn').addEventListener('change',async e=>{ const file=e.target.files[0]; if(!file||!upTarget) return; const id=upTarget; $('photoMsg').textContent='사진 올리는 중…';
  try{ const blob=await shrink(file); const res=await capAssets.upload(blob,{type:'image/jpeg'}); await capDb.doc('photos/'+id).set({assetId:res.id,at:Date.now()}); $('photoMsg').textContent='사진을 넣었어요. 영상에서 그 장소에 도착할 때 나와요.'; }
  catch(err){ $('photoMsg').textContent=err&&err.code==='too_large'?'사진이 너무 커요. 더 작은 사진으로 올려주세요.':err&&err.code==='not_uploader'?'이 페이지에 사진을 올릴 권한이 없어요.':'사진을 올리지 못했어요. 잠시 후 다시 해주세요.'; } });
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,1600/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',.86); URL.revokeObjectURL(img.src); }; img.onerror=rej; img.src=URL.createObjectURL(file); }); }
function photoFor(id){ return PHOTOS[id]||(NPH[id]&&NPH[id][0])||null; }
function loadImg(id){ const ph=photoFor(id); if(!ph) return; if(IMG[id]&&IMG[id].dataset.a===ph.assetId) return; const im=new Image(); im.dataset.a=ph.assetId; im.src='/_blob/'+ph.assetId; IMG[id]=im; }

function showSetup(on){ $('vsetup').hidden=!on; }
function openVideo(){
  VID.on=true; VID.saved={day:S.day,cam:camera.position.clone(),target:controls.target.clone()}; controls.enabled=false; $('vid').hidden=false; bubble.hidden=true;
  renderer.setPixelRatio(1); renderer.setSize(VW,VH,false); camera.aspect=VW/VH; camera.updateProjectionMatrix();
  STYLE.cur=VID.style; renderSetup(); buildTimeline(); VID.T=0; VID.playing=false; VID.curSeg=null; VID.dayBuilt=0; showSetup(true);
  (document.fonts&&document.fonts.load?document.fonts.load('64px "Jua"'):Promise.resolve()).catch(()=>{});
}
function closeVideo(){ if(VID.recording) return; VID.on=false; VID.playing=false; $('vid').hidden=true; controls.enabled=true; STYLE.cur='day';
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1)); S.day=VID.saved.day; camera.position.copy(VID.saved.cam); controls.target.copy(VID.saved.target); onDayChange(); resize(); }
function startPlay(fromStart){ if(fromStart){ VID.T=0; VID.curSeg=null; } VID.snap=true; VID.cam.copy(camera.position); VID.look.set(0,0,0); [...Object.keys(PHOTOS),...Object.keys(NPH)].forEach(loadImg); VID.playing=true; showSetup(false); }
$('vClose').addEventListener('click',closeVideo);
$('vSetupBtn').addEventListener('click',()=>{ if(VID.recording) return; VID.playing=false; showSetup(true); });
$('vPlay').addEventListener('click',()=>{ buildTimeline(); startPlay(true); });
vc.addEventListener('click',()=>{ if(VID.recording||!$('vsetup').hidden) return; VID.playing=!VID.playing; });
$('vbar').addEventListener('click',e=>{ const b=e.target.closest('[data-t]'); if(!b||VID.recording) return; VID.T=+b.dataset.t; VID.curSeg=null; VID.snap=true; if(!$('vsetup').hidden) showSetup(false); VID.playing=true; });
document.addEventListener('keydown',e=>{ if(VID.on&&e.key==='Escape') closeVideo(); });

let rec=null, chunks=[], recMime='';
$('vSave').addEventListener('click',()=>{
  if(!capDl||typeof MediaRecorder==='undefined'||!vc.captureStream){ $('vNote').textContent='이 브라우저는 녹화를 지원하지 않아요. 휴대폰 화면 녹화를 써 주세요.'; return; }
  buildTimeline(); recMime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  try{ rec=new MediaRecorder(vc.captureStream(30),recMime?{mimeType:recMime,videoBitsPerSecond:6e6}:{}); }catch(err){ $('vNote').textContent='녹화를 시작하지 못했어요. 휴대폰 화면 녹화를 써 주세요.'; return; }
  chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); }; rec.onstop=finishRecording;
  VID.recording=true; $('vstat').textContent='녹화 중… 끝까지 기다려 주세요'; rec.start(500); startPlay(true); });
function stopRecording(){ if(rec&&rec.state!=='inactive') rec.stop(); }
async function finishRecording(){
  VID.recording=false; const ext=recMime.includes('mp4')?'mp4':'webm'; const blob=new Blob(chunks,{type:recMime||'video/webm'});
  $('vstat').textContent=`약 ${Math.round(VID.total)}초`; showSetup(true);
  try{ await capDl.save({filename:`둘이서-홍콩-${VID.range==='all'?'전체':VID.range+'일차'}.${ext}`,data:blob}); $('vNote').textContent='영상을 저장했어요.'; }
  catch(err){ const c=err&&err.code; $('vNote').textContent=c==='declined'?'저장을 취소했어요. 다시 저장하려면 영상 저장을 눌러 주세요.':c==='rate_limited'?'다른 저장 창이 열려 있어요. 잠시 후 다시 눌러 주세요.':'이 화면에서는 저장할 수 없어요. 휴대폰 화면 녹화를 써 주세요.'; }
}

/* ---- storage: claude.ai capabilities inside the artifact, own API (/api, Notion) on the web service ---- */
async function ensureLogin(){ try{ const r=await fetch('/api/me',{credentials:'same-origin'}); if(r.ok){ API_WHO=(await r.json()).who||''; return true; } if(r.status!==401) return false; }catch(e){ return false; }
  return new Promise(res=>{ const g=$('gate'); g.hidden=false; $('gatePw').focus();
    $('gateForm').onsubmit=async e=>{ e.preventDefault(); const who=(document.querySelector('input[name=gateWho]:checked')||{}).value||'희주'; $('gateMsg').textContent='확인 중…';
      try{ const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('gatePw').value,who})}); if(r.ok){ API_WHO=who; g.hidden=true; res(true); } else $('gateMsg').textContent='비밀번호가 달라요'; }catch(err){ $('gateMsg').textContent='연결이 안 돼요. 잠시 후 다시 해주세요'; } }; }); }
async function apiInit(){ if(!/^https?:/.test(location.protocol)) return null; if(!(await ensureLogin())) return null; API_MODE=true;
  const L={notes:[],notephotos:[],todos:[]}, KIND={notes:'note',notephotos:'photo',todos:'todo'}; let cache=[];
  const snap=n=>({docs:cache.filter(x=>x.kind===KIND[n]).map(x=>({id:n==='notes'?x.stopId:x.id,data:()=>n==='notes'?{text:x.text,at:x.at}:n==='notephotos'?{stopId:x.stopId,assetId:x.id,at:x.at}:{day:x.day,text:x.text,done:x.done,at:x.at}}))});
  let lastSig=''; const emit=(force)=>{ const sig=JSON.stringify(cache); if(!force&&sig===lastSig) return; lastSig=sig; Object.keys(L).forEach(n=>L[n].forEach(f=>f(snap(n)))); };
  async function refresh(){ try{ const r=await fetch('/api/records',{credentials:'same-origin'}); if(r.status===401){ await ensureLogin(); return; } if(!r.ok) return; cache=(await r.json()).records||[]; emit(); }catch(e){} }
  const call=(m,body,q)=>fetch('/api/records'+(q||''),{method:m,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined}).then(r=>{ if(!r.ok) throw new Error('api '+r.status); return r.json(); });
  const place=id=>{ const st=findStop(id); return st?short(st.name):(id==='d0-2'?'인천공항':''); };
  const db={ collection:n=>({ onSnapshot:cb=>{ (L[n]||(L[n]=[])).push(cb); cb(snap(n)); return ()=>{}; },
      add:async v=>{ if(n==='todos'){ const tmp={id:'tmp'+Date.now(),kind:'todo',day:v.day,text:v.text,done:!!v.done,at:Date.now()}; cache=cache.concat(tmp); emit(); const r=await call('POST',{kind:'todo',day:v.day,text:v.text,done:!!v.done}); tmp.id=r.id; } else if(n==='notephotos') await call('PATCH',{id:v.assetId,stopId:v.stopId,place:place(v.stopId)}); await refresh(); } }),
    doc:p=>{ const [n,id]=p.split('/'); return {
      set:async v=>{ if(n!=='notes'){ const t=cache.find(x=>x.id===id); if(t){ t.done=!!v.done; t.text=v.text; emit(true); } } if(n==='notes'){ const ex=cache.find(x=>x.kind==='note'&&x.stopId===id); if(ex) await call('PATCH',{id:ex.id,text:v.text}); else await call('POST',{kind:'note',stopId:id,place:place(id),text:v.text}); } else await call('PATCH',{id,text:v.text,done:!!v.done}); await refresh(); },
      delete:async()=>{ cache=cache.filter(x=>x.id!==id); emit(); await call('DELETE',null,'?id='+encodeURIComponent(id)); await refresh(); } }; } };
  const assets={ upload:async blob=>{ const r=await fetch('/api/photo',{method:'POST',headers:{'content-type':'image/jpeg'},body:blob}); if(r.status===413) throw {code:'too_large'}; if(!r.ok) throw new Error('upload'); return r.json(); }, delete:async()=>{} };
  await refresh(); setInterval(()=>{ if(!document.hidden) refresh(); },20000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });
  return {db,assets}; }
(async function(){ const cl=window.claude;
  if(cl&&cl.use){ try{ capDl=await cl.use('downloads'); }catch(e){}
    try{ capAssets=await cl.use('assets'); }catch(e){}
    try{ capDb=await cl.use('db'); }catch(e){} }
  else { const api=await apiInit(); if(!api) return; capDb=api.db; capAssets=api.assets; }
  if(capDb){ try{ capDb.collection('photos').onSnapshot(snap=>{ Object.keys(PHOTOS).forEach(k=>delete PHOTOS[k]); snap.docs.forEach(d=>{ const v=d.data(); if(v&&v.assetId) PHOTOS[d.id]={assetId:String(v.assetId)}; }); Object.keys(PHOTOS).forEach(loadImg); if(VID.on) renderPhotoList(); },()=>{}); }catch(e){} }
  if(capDb){ try{ capDb.collection('notes').onSnapshot(snap=>{ NOTES={}; snap.docs.forEach(d=>{ const v=d.data(); if(v) NOTES[d.id]={text:String(v.text||''),at:+v.at||0}; }); renderPanel(); },()=>{}); }catch(e){}
    try{ capDb.collection('notephotos').onSnapshot(snap=>{ NPH={}; snap.docs.map(d=>({id:d.id,...(d.data()||{})})).filter(v=>v.assetId&&v.stopId).sort((a,b)=>(a.at||0)-(b.at||0)).forEach(v=>{ (NPH[v.stopId]=NPH[v.stopId]||[]).push({id:v.id,assetId:String(v.assetId)}); }); renderPanel(); },()=>{}); }catch(e){}
    try{ capDb.collection('todos').onSnapshot(snap=>{ TODOS=snap.docs.map(d=>{ const v=d.data()||{}; return {id:d.id,day:+v.day||0,text:String(v.text||''),done:!!v.done,at:+v.at||0}; }).filter(t=>t.text).sort((a,b)=>a.at-b.at); renderPanel(); },()=>{}); }catch(e){} renderPanel(true); }
  if(VID.on) renderSetup(); })();

new ResizeObserver(resize).observe(view); resize();
renderDays(); syncPlay(); syncFollow(); syncLive(); syncRain(); onDayChange(); if(S.live) hideStart(); if(S.live) hideStart();
{ const s0=scenePos(PLAN,S.day,S.t).pos; controls.target.set(s0.x,0,s0.z); camera.position.set(s0.x+4,30,s0.z+34); controls.update(); }
requestAnimationFrame(frame);
})();
